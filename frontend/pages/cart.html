<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Cart - kiryana store</title><link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/store.css"></head>
<body>
  <header><div class="nav-container"><a href="index.html" class="logo">🛒 kiryana store</a></div></header>
  <main class="container">
    <h2>Shopping Cart</h2>
    <div id="cartItemsList" style="background:white; padding:1.5rem; margin-top:1rem;"></div>
    <div style="background:white; padding:1.5rem; margin-top:1rem;">
      <h3 id="orderTotal">Total: ₹0</h3>
      <input type="tel" id="custPhone" class="search-input" placeholder="Phone Number" style="margin: 10px 0; width:100%;">
      <div>
        <input type="checkbox" id="orderConfirmCheck">
        <label for="orderConfirmCheck">I have verified my items & quantities before ordering.</label>
      </div>
      <button class="btn-primary" style="margin-top:10px; width:100%;" onclick="processOrderCheckout()">Place Order</button>
    </div>
  </main>
  <script src="../js/checkout.js"></script>
</body>
</html>
